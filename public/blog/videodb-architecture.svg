<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KathaQuest and VideoDB architecture</title>
  <desc id="desc">A chapter becomes a lesson plan, focused VideoDB searches, reviewed evidence, a hybrid storyboard, and an interactive multilingual lesson.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8dd"/>
      <stop offset="1" stop-color="#eee9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#18221d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5b45"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <text x="90" y="92" fill="#1d5b45" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2">KATHAQUEST MEDIA INTELLIGENCE PIPELINE</text>
  <text x="90" y="150" fill="#18221d" font-family="Arial, sans-serif" font-size="46" font-weight="800">A chapter asks the question. VideoDB finds the evidence.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="90" y="245" width="250" height="180" rx="26" fill="#fffdf7" stroke="#18221d" stroke-opacity=".16"/>
    <rect x="110" y="266" width="74" height="34" rx="17" fill="#ffdf69"/>
    <text x="147" y="289" text-anchor="middle" fill="#18221d" font-size="15" font-weight="800">INPUT</text>
    <text x="120" y="345" fill="#18221d" font-size="28" font-weight="800">Chapter PDF</text>
    <text x="120" y="382" fill="#68736d" font-size="18">Source text and age</text>

    <rect x="410" y="245" width="270" height="180" rx="26" fill="#fffdf7" stroke="#18221d" stroke-opacity=".16"/>
    <rect x="430" y="266" width="106" height="34" rx="17" fill="#dff4e7"/>
    <text x="483" y="289" text-anchor="middle" fill="#1d5b45" font-size="15" font-weight="800">PLAN</text>
    <text x="440" y="345" fill="#18221d" font-size="28" font-weight="800">Lesson designer</text>
    <text x="440" y="382" fill="#68736d" font-size="18">Objectives and queries</text>

    <rect x="750" y="210" width="360" height="250" rx="30" fill="#1d5b45"/>
    <rect x="777" y="236" width="104" height="34" rx="17" fill="#ffdf69"/>
    <text x="829" y="259" text-anchor="middle" fill="#18221d" font-size="15" font-weight="800">VIDEODB</text>
    <text x="785" y="319" fill="#fffdf7" font-size="31" font-weight="800">Search real footage</text>
    <text x="785" y="362" fill="#dff4e7" font-size="19">Spoken-word index</text>
    <text x="785" y="396" fill="#dff4e7" font-size="19">Visual scene index</text>
    <text x="785" y="430" fill="#dff4e7" font-size="19">Timestamped results</text>

    <rect x="1180" y="245" width="330" height="180" rx="26" fill="#fffdf7" stroke="#18221d" stroke-opacity=".16"/>
    <rect x="1200" y="266" width="116" height="34" rx="17" fill="#ffd8ce"/>
    <text x="1258" y="289" text-anchor="middle" fill="#6f3025" font-size="15" font-weight="800">REVIEW</text>
    <text x="1210" y="345" fill="#18221d" font-size="28" font-weight="800">Precision gate</text>
    <text x="1210" y="382" fill="#68736d" font-size="18">Safety, relevance, licence</text>

    <rect x="260" y="585" width="330" height="190" rx="28" fill="#fffdf7" stroke="#18221d" stroke-opacity=".16"/>
    <rect x="282" y="608" width="128" height="34" rx="17" fill="#dff4e7"/>
    <text x="346" y="631" text-anchor="middle" fill="#1d5b45" font-size="15" font-weight="800">COMPOSE</text>
    <text x="292" y="688" fill="#18221d" font-size="28" font-weight="800">VideoDB timeline</text>
    <text x="292" y="728" fill="#68736d" font-size="18">Clips, HLS, new narration</text>

    <rect x="665" y="585" width="330" height="190" rx="28" fill="#fffdf7" stroke="#18221d" stroke-opacity=".16"/>
    <rect x="687" y="608" width="122" height="34" rx="17" fill="#dfd8fa"/>
    <text x="748" y="631" text-anchor="middle" fill="#41366f" font-size="15" font-weight="800">PRESENT</text>
    <text x="697" y="688" fill="#18221d" font-size="28" font-weight="800">Hybrid storyboard</text>
    <text x="697" y="728" fill="#68736d" font-size="18">Footage, diagrams, Maya</text>

    <rect x="1070" y="585" width="330" height="190" rx="28" fill="#18221d"/>
    <rect x="1092" y="608" width="106" height="34" rx="17" fill="#ffdf69"/>
    <text x="1145" y="631" text-anchor="middle" fill="#18221d" font-size="15" font-weight="800">LEARN</text>
    <text x="1102" y="688" fill="#fffdf7" font-size="28" font-weight="800">Interactive lesson</text>
    <text x="1102" y="728" fill="#dff4e7" font-size="18">Watch, ask, quiz, revise</text>
  </g>

  <g fill="none" stroke="#1d5b45" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M340 335 H397"/>
    <path d="M680 335 H735"/>
    <path d="M1110 335 H1165"/>
    <path d="M1345 425 C1345 520 425 490 425 570"/>
    <path d="M590 680 H650"/>
    <path d="M995 680 H1055"/>
  </g>
  <text x="90" y="844" fill="#68736d" font-family="Arial, sans-serif" font-size="18">If reviewed footage is unavailable, the same storyboard uses a chapter-grounded visual explainer instead of a weak clip.</text>
</svg>
